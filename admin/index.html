<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Admin | e-RELIEF</title>
<link rel="icon" href="/assets/img/logo.png">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#081426;color:#eef4ff;min-height:100vh;display:flex;flex-direction:column}
header{background:#102b50;padding:18px 22px;border-bottom:1px solid #24466e}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:50%;padding:6px;display:flex;flex-shrink:0;box-shadow:0 0 0 3px #1677d2,0 4px 12px rgba(0,0,0,.35);overflow:hidden}
.logo img{height:52px;width:52px;object-fit:contain;display:block}
.brand h1{margin:0;color:#60c7ff;font-size:24px}
.brand p{margin:4px 0 0;color:#c4d8f2;font-size:14px}
.auth{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#who{color:#cbdcf2;font-size:14px}
.tag{background:#174e78;padding:5px 10px;border-radius:20px;font-size:13px}
nav{display:flex;gap:10px;flex-wrap:wrap;padding:15px;max-width:1100px;width:100%;margin:auto}
nav a,button{background:#1677d2;color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;font-size:15px;font-family:inherit}
nav a:hover,button:hover{background:#2995ef}
button.ghost{background:#24466e}
button.ghost:hover{background:#34506e}
main{padding:15px;max-width:1100px;width:100%;margin:auto;flex:1}
.card{background:#10233d;border:1px solid #24466e;border-radius:12px;padding:18px;margin-bottom:16px}
h2{color:#60c7ff;margin:0 0 10px}
.warn{color:#ffd28a}
.hidden{display:none!important}
footer{text-align:center;padding:25px;color:#9db4d1}
@media(max-width:600px){
  .logo img{height:40px;width:40px}
  .brand h1{font-size:20px}
  .brand p{font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <div class="logo"><img src="/assets/img/logo.png" alt="Logo SMK Munshi Abdullah"></div>
      <div>
        <h1>Panel Admin</h1>
        <p>e-RELIEF · SMK Munshi Abdullah</p>
      </div>
    </div>
    <div class="auth">
      <span id="who"></span>
      <span id="roleTag" class="tag hidden"></span>
      <button id="loginBtn" type="button" class="hidden">Log masuk</button>
      <button id="logoutBtn" type="button" class="ghost hidden">Log keluar</button>
    </div>
  </div>
</header>

<nav>
  <a href="/">Dashboard</a>
  <a href="/tv/">Paparan TV</a>
</nav>

<main>
  <!-- Skrin ini dipaparkan sehingga server mengesahkan role -->
  <section class="card" id="gate">
    <h2>Memeriksa akses...</h2>
    <p id="gateMsg">Sila tunggu sebentar.</p>
  </section>

  <!-- Kandungan panel hanya dipaparkan selepas server mengesahkan role -->
  <div id="panel" class="hidden">
    <section class="card">
      <h2>Jadual Relief</h2>
      <p>Modul jadual akan dibina pada langkah 6.</p>
    </section>

    <section class="card" id="adminOnly">
      <h2>Pengurusan Admin</h2>
      <p>Hanya untuk Admin Utama. Modul ini akan dibina pada langkah 5.</p>
    </section>
  </div>
</main>

<footer>e-RELIEF · SMK Munshi Abdullah</footer>

<script>
const $ = id => document.getElementById(id)

function showGate(message, needLogin) {
  $('panel').classList.add('hidden')
  $('gate').classList.remove('hidden')
  $('gateMsg').textContent = message
  $('gateMsg').className = needLogin ? '' : 'warn'
  $('loginBtn').classList.toggle('hidden', !needLogin)
}

async function checkAccess() {
  const user = netlifyIdentity.currentUser()
  if (!user) {
    $('who').textContent = ''
    $('roleTag').classList.add('hidden')
    $('logoutBtn').classList.add('hidden')
    return showGate('Sila log masuk untuk mengakses panel admin.', true)
  }

  $('logoutBtn').classList.remove('hidden')
  $('who').textContent = user.email || ''

  try {
    const token = await user.jwt()
    const r = await fetch('/.netlify/functions/me', {
      headers: { Authorization: 'Bearer ' + token }
    })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || 'Akses ditolak')

    $('roleTag').textContent = d.role === 'admin_utama' ? 'Admin Utama' : 'Admin'
    $('roleTag').classList.remove('hidden')
    $('adminOnly').classList.toggle('hidden', d.role !== 'admin_utama')
    $('gate').classList.add('hidden')
    $('loginBtn').classList.add('hidden')
    $('panel').classList.remove('hidden')
  } catch (e) {
    $('roleTag').classList.add('hidden')
    showGate(e.message || 'Akaun ini tiada akses admin.', false)
  }
}

$('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'))
$('logoutBtn').addEventListener('click', () => netlifyIdentity.logout())

netlifyIdentity.on('init', checkAccess)
netlifyIdentity.on('login', () => { netlifyIdentity.close(); checkAccess() })
netlifyIdentity.on('logout', checkAccess)
</script>
</body>
</html>
