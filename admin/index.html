<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Admin | e-RELIEF</title>
<link rel="icon" href="/assets/img/logo.png">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#081426;color:#eef4ff;min-height:100vh;display:flex;flex-direction:column}
header{background:#102b50;padding:18px 22px;border-bottom:1px solid #24466e}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{display:flex;flex-shrink:0}
.logo img{height:72px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.brand h1{margin:0;color:#60c7ff;font-size:24px}
.brand p{margin:4px 0 0;color:#c4d8f2;font-size:14px}
.auth{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#who{color:#cbdcf2;font-size:14px}
.tag{background:#174e78;padding:5px 10px;border-radius:20px;font-size:13px}
nav{display:flex;gap:10px;flex-wrap:wrap;padding:15px;max-width:1100px;width:100%;margin:auto}
nav a,button{background:#1677d2;color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;font-size:15px;font-family:inherit;display:inline-block}
nav a:hover,button:hover{background:#2995ef}
button.ghost{background:#24466e}
button.ghost:hover{background:#34506e}
button.small{padding:6px 10px;font-size:13px}
button.danger{background:#9b2c2c}
button.danger:hover{background:#c53030}
button.ok{background:#1f6b3d}
button.ok:hover{background:#2c8a50}
button:disabled{background:#34506e;cursor:not-allowed}
main{padding:15px;max-width:1100px;width:100%;margin:auto;flex:1}
.card{background:#10233d;border:1px solid #24466e;border-radius:12px;padding:18px;margin-bottom:16px}
h2{color:#60c7ff;margin:0 0 12px}
.warn{color:#ffd28a}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:#cbdcf2;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;border-radius:7px;border:1px solid #49627f;background:#091a30;color:#fff;font-family:inherit;font-size:14px}
textarea{resize:vertical;min-height:60px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.msg{margin-top:10px;font-size:14px;color:#ffd28a;white-space:pre-line}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.tablewrap{overflow-x:auto}
table{
