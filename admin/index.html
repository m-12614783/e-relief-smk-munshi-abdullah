<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Admin | e-RELIEF</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#081426;color:#eef4ff}
header{background:#102b50;padding:20px 22px}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;color:#60c7ff;font-size:24px}
header p{margin:6px 0 0;color:#c4d8f2}
.auth{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#who{color:#cbdcf2;font-size:14px}
nav{display:flex;gap:10px;flex-wrap:wrap;padding:15px;max-width:1100px;margin:auto}
nav a,button{background:#1677d2;color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;font-size:15px}
nav a:hover,button:hover{background:#2995ef}
main{padding:15px;max-width:1100px;margin:auto}
.card{background:#10233d;border:1px solid #24466e;border-radius:12px;padding:18px;margin-bottom:16px}
h2{color:#60c7ff;margin-top:0}
.hidden{display:none!important}
.ghost{background:#24466e}
.ghost:hover{background:#34506e}
.warn{color:#ffd28a}
footer{text-align:center;padding:25px;color:#9db4d1}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>Panel Admin</h1>
      <p>e-RELIEF · SMK Munshi Abdullah</p>
    </div>
    <div class="auth">
      <span id="who"></span>
      <span id="roleTag" class="hidden" style="background:#174e78;padding:5px 9px;border-radius:20px;font-size:13px"></span>
      <button id="loginBtn" type="button" class="hidden">Log masuk</button>
      <button id="logoutBtn" type="button" class="ghost hidden">Log keluar</button>
    </div>
  </div>
</header>

<nav>
  <a href="/">Dashboard</a>
  <a href="/tv/">Paparan TV</a>
</nav>

<main>
  <!-- Skrin sebelum akses disahkan -->
  <section class="card" id="gate">
    <h2>Memeriksa akses...</h2>
    <p id="gateMsg">Sila tunggu sebentar.</p>
  </section>

  <!-- Kandungan panel hanya dipaparkan selepas server mengesahkan role -->
  <div id="panel" class="hidden">
    <section class="card">
      <h2>Jadual Relief</h2>
      <p>Modul jadual akan dibina pada langkah 6.</p>
    </section>

    <section class="card" id="adminOnly">
      <h2>Pengurusan Admin</h2>
      <p>Hanya untuk Admin Utama. Modul ini akan dibina pada langkah 5.</p>
    </section>
  </div>
</main>

<footer>e-RELIEF · SMK Munshi Abdullah</footer>

<script>
const $ = id => document.getElementById(id)

function showGate(message, needLogin) {
  $('panel').classList.add('hidden')
  $('gate').classList.remove('hidden')
  $('gateMsg').textContent = message
  $('gateMsg').className = needLogin ? '' : 'warn'
  $('loginBtn').classList.toggle('hidden', !needLogin)
}

async function checkAccess() {
  const user = netlifyIdentity.currentUser()
  if (!user) {
    $('who').textContent = ''
    $('logoutBtn').classList.add('hidden')
    return showGate('Sila log masuk untuk mengakses panel admin.', true)
  }

  $('logoutBtn').classList.remove('hidden')
  $('who').textContent = user.email || ''

  try {
    const token = await user.jwt()
    const r = await fetch('/.netlify/functions/me', {
      headers: { Authorization: 'Bearer ' + token }
    })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || 'Akses ditolak')

    $('roleTag').textContent = d.role === 'admin_utama' ? 'Admin Utama' : 'Admin'
    $('roleTag').classList.remove('hidden')
    $('adminOnly').classList.toggle('hidden', d.role !== 'admin_utama')
    $('gate').classList.add('hidden')
    $('panel').classList.remove('hidden')
  } catch (e) {
    $('roleTag').classList.add('hidden')
    showGate(e.message || 'Akaun ini tiada akses admin.', false)
  }
}

$('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'))
$('logoutBtn').addEventListener('click', () => netlifyIdentity.logout())

netlifyIdentity.on('init', checkAccess)
netlifyIdentity.on('login', () => { netlifyIdentity.close(); checkAccess() })
netlifyIdentity.on('logout', () => {
  $('roleTag').classList.add('hidden')
  checkAccess()
})
</script>
</body>
</html>
