<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e-RELIEF | SMK Munshi Abdullah</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#081426;color:#eef4ff}
header{background:#102b50;padding:20px 22px}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;color:#60c7ff}
header p{margin:6px 0 0;color:#c4d8f2}
.auth{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#who{color:#cbdcf2;font-size:14px}
nav{display:flex;gap:10px;flex-wrap:wrap;padding:15px;max-width:1100px;margin:auto}
nav a,button{background:#1677d2;color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;font-size:15px}
nav a:hover,button:hover{background:#2995ef}
main{padding:15px;max-width:1100px;margin:auto}
.card{background:#10233d;border:1px solid #24466e;border-radius:12px;padding:18px;margin-bottom:16px}
h2{color:#60c7ff;margin-top:0}
.hidden{display:none!important}
.ghost{background:#24466e}
.ghost:hover{background:#34506e}
footer{text-align:center;padding:25px;color:#9db4d1}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>e-RELIEF</h1>
      <p>Sistem Pengurusan Guru Relief · SMK Munshi Abdullah</p>
    </div>
    <div class="auth">
      <span id="who"></span>
      <button id="loginBtn" type="button">Log masuk</button>
      <button id="logoutBtn" type="button" class="ghost hidden">Log keluar</button>
    </div>
  </div>
</header>

<nav>
  <a href="/">Dashboard</a>
  <a href="/admin/" id="adminLink" class="hidden">Panel Admin</a>
  <a href="/tv/">Paparan TV</a>
</nav>

<main>
  <section class="card">
    <h2>Dashboard</h2>
    <p id="today"></p>
    <p id="status">Memeriksa sesi...</p>
  </section>

  <section class="card">
    <h2>Permohonan Relief</h2>
    <p>Borang permohonan akan disambungkan pada langkah 7.</p>
  </section>
</main>

<footer>e-RELIEF · SMK Munshi Abdullah</footer>

<script>
const $ = id => document.getElementById(id)

$('today').textContent = new Date().toLocaleDateString('ms-MY', {
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
})

function showSignedOut() {
  $('who').textContent = ''
  $('loginBtn').classList.remove('hidden')
  $('logoutBtn').classList.add('hidden')
  $('adminLink').classList.add('hidden')
  $('status').textContent = 'Log masuk untuk mengakses panel admin.'
}

async function loadRole() {
  const user = netlifyIdentity.currentUser()
  if (!user) return showSignedOut()

  $('loginBtn').classList.add('hidden')
  $('logoutBtn').classList.remove('hidden')
  $('who').textContent = user.email || ''

  try {
    const token = await user.jwt()
    const r = await fetch('/.netlify/functions/me', {
      headers: { Authorization: 'Bearer ' + token }
    })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || 'Ralat')

    $('adminLink').classList.remove('hidden')
    $('status').textContent = d.role === 'admin_utama'
      ? 'Anda log masuk sebagai Admin Utama.'
      : 'Anda log masuk sebagai Admin.'
  } catch (e) {
    $('adminLink').classList.add('hidden')
    $('status').textContent = e.message || 'Akaun ini tiada akses admin.'
  }
}

$('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'))
$('logoutBtn').addEventListener('click', () => netlifyIdentity.logout())

netlifyIdentity.on('init', loadRole)
netlifyIdentity.on('login', () => { netlifyIdentity.close(); loadRole() })
netlifyIdentity.on('logout', showSignedOut)
</script>
</body>
</html>
